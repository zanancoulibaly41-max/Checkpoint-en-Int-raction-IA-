<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Produits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Nos Produits</h1>
    <button class="theme-toggle" id="themeBtn">
        🌙 Mode sombre
    </button>
</header>

<section class="gallery">

    <div class="card fade-delay-1">
        <img src="https://picsum.photos/500/300?random=1" alt="Casque Audio">
        <div class="card-content">
            <h2>Casque Audio</h2>
            <div class="price">79 €</div>
            <p>Son immersif, design élégant et autonomie longue durée.</p>
            <a href="#" class="btn">Acheter</a>
        </div>
    </div>

    <div class="card fade-delay-2">
        <img src="https://picsum.photos/500/300?random=2" alt="Montre Connectée">
        <div class="card-content">
            <h2>Montre Connectée</h2>
            <div class="price">129 €</div>
            <p>Suivi sportif, notifications intelligentes et batterie optimisée.</p>
            <a href="#" class="btn">Acheter</a>
        </div>
    </div>

    <div class="card fade-delay-3">
        <img src="https://picsum.photos/500/300?random=3" alt="Appareil Photo">
        <div class="card-content">
            <h2>Appareil Photo</h2>
            <div class="price">499 €</div>
            <p>Capteur haute résolution et qualité d'image professionnelle.</p>
            <a href="#" class="btn">Acheter</a>
        </div>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
